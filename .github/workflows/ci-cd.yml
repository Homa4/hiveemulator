name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Run tests
        run: |
          cd src/CommunicationControl
          dotnet test --verbosity normal

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Build backend
        run: |
          cd src/CommunicationControl
          dotnet publish -c Release -o ./published

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: |
          cd src/MapClient
          npm install
          npm run build

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: src/CommunicationControl/published

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: src/MapClient/dist

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend
          path: src/CommunicationControl/published

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend
          path: src/MapClient/dist

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        env:
            IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/communication-control:${{ github.run_number }}
            IMAGE_LATEST: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/communication-control:latest
        run: |
            docker build -t ${IMAGE_TAG,,} -t ${IMAGE_LATEST,,} \
            -f src/CommunicationControl/DevOpsProject/Dockerfile \
            src/CommunicationControl
            docker push ${IMAGE_TAG,,}
            docker push ${IMAGE_LATEST,,}

      - name: Build and push frontend image
        env:
            IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/map-client:${{ github.run_number }}
            IMAGE_LATEST: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/map-client:latest
        run: |
            docker build -t ${IMAGE_TAG,,} -t ${IMAGE_LATEST,,} \
            src/MapClient
            docker push ${IMAGE_TAG,,}
            docker push ${IMAGE_LATEST,,}
