name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  workflow_dispatch: # ручний запуск

jobs:
  # =====================
  # СТАДІЯ 1 - ТЕСТУВАННЯ
  # =====================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Run tests
        run: |
          cd src/CommunicationControl
          dotnet test --verbosity normal

  # =====================
  # СТАДІЯ 2 - БІЛД
  # =====================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Build backend
        run: |
          cd src/CommunicationControl
          dotnet publish -c Release -o ./published

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: |
          cd src/MapClient
          npm install
          npm run build

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: src/CommunicationControl/published

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: src/MapClient/dist

  # =====================
  # СТАДІЯ 3 - DOCKER
  # =====================
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend
          path: src/CommunicationControl/published

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend
          path: src/MapClient/dist

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/communication-control:${{ github.run_number }} \
            -f src/CommunicationControl/DevOpsProject/Dockerfile \
            src/CommunicationControl
          docker push ghcr.io/${{ github.repository }}/communication-control:${{ github.run_number }}

      - name: Build and push frontend image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/map-client:${{ github.run_number }} \
            src/MapClient
          docker push ghcr.io/${{ github.repository }}/map-client:${{ github.run_number }}

  # =====================
  # СТАДІЯ 4 - ДЕПЛОЙ DEV
  # =====================
  deploy_dev:
    name: Deploy DEV
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/dev' # тільки для dev гілки
    environment: development
    steps:
      - name: Deploy to DEV
        run: |
          echo "Deploying version ${{ github.run_number }} to DEV server..."
          echo "Image: ghcr.io/${{ github.repository }}/communication-control:${{ github.run_number }}"

  # =====================
  # СТАДІЯ 4 - ДЕПЛОЙ PROD
  # =====================
  deploy_prod:
    name: Deploy PROD
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' # тільки для main гілки
    environment: production
    steps:
      - name: Deploy to PROD
        run: |
          echo "Deploying version ${{ github.run_number }} to PROD server..."
          echo "Image: ghcr.io/${{ github.repository }}/communication-control:${{ github.run_number }}"